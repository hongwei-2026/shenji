name: PR Quality Gate

# 严格门禁：专为 PR 设计，提高合入质量
on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-hygiene:
    name: PR hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Require meaningful PR title & body
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('Not a pull_request event; skip hygiene.');
              return;
            }
            const title = (pr.title || '').trim();
            const body = (pr.body || '').trim();
            const errors = [];

            if (title.length < 8) {
              errors.push('PR title must be at least 8 characters.');
            }
            if (/^(wip|tmp|test|fix|update)\b/i.test(title) && !pr.draft) {
              errors.push('WIP/tmp/test titles must use Draft PR, or rewrite a clear title.');
            }
            if (body.length < 40) {
              errors.push('PR body must describe Summary + Test plan (>= 40 chars). Use the PR template.');
            }
            if (!/test plan|测试|验证/i.test(body)) {
              errors.push('PR body must include a Test plan / 测试说明 section.');
            }
            if (errors.length) {
              core.setFailed(errors.join('\n'));
            }

  critical-lint:
    name: Critical lint (whole repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tools
        run: pip install -r requirements-dev.txt
      - name: Ruff critical rules
        run: ruff check app.py modules tests

  changed-files-strict:
    name: Strict lint on changed Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tools
        run: pip install -r requirements-dev.txt
      - name: Collect changed Python files
        id: changes
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=0 || true
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD | grep -E '\.py$' | grep -Ev '^(native/|static/)' || true)
          echo "count=${#FILES[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "No Python files changed."
            exit 0
          fi
          printf '%s\n' "${FILES[@]}" | tee /tmp/changed_py.txt
          {
            echo 'files<<EOF'
            cat /tmp/changed_py.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Strict Ruff on changed files
        if: steps.changes.outputs.count != '0'
        run: |
          # 变更文件使用更严规则：未使用导入/变量、bugbear、简化、安全常见项
          ruff check $(cat /tmp/changed_py.txt) \
            --select E,F,W,B,UP,S110,S102,S301,S302,S306,S307 \
            --ignore E501,E402
      - name: PR change policy (tests required)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python scripts/ci_pr_checks.py

  coverage-and-diff:
    name: Coverage + new-code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Fetch base for diff-cover
        run: git fetch origin "${{ github.base_ref }}" --depth=0 || true
      - name: Pytest with coverage floor
        run: |
          pytest tests \
            --cov=modules --cov=app \
            --cov-branch \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=17
      - name: Diff coverage on changed lines
        run: |
          diff-cover coverage.xml \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 40 \
            --exclude 'tests/*' 'native/*' 'static/*' \
            || {
              echo "::error::Changed lines need >=45% test coverage. Add/adjust tests for your diff."
              exit 1
            }

  security-high:
    name: Bandit (high) + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tools
        run: pip install -r requirements-dev.txt
      - name: Bandit high severity must be zero
        run: |
          bandit -r modules app.py -lll -q -x tests,native,static
      - name: Dependency vulnerability audit
        run: |
          pip-audit -r requirements.txt --strict \
            || {
              echo "::error::Vulnerable dependencies detected. Upgrade packages or justify with an issue."
              exit 1
            }
