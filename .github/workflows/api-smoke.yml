name: API Smoke

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: api-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-smoke:
    name: Flask API smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask app
        run: |
          mkdir -p data uploads
          nohup python app.py > /tmp/flask.log 2>&1 &
          echo $! > /tmp/flask.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/login >/dev/null; then
              echo "Flask is up"
              exit 0
            fi
            sleep 1
          done
          echo "Flask failed to start"
          cat /tmp/flask.log
          exit 1

      - name: Register, login, upload & audit
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:5000
          COOKIE=$(mktemp)

          curl -sf -c "$COOKIE" -b "$COOKIE" -X POST "$BASE/api/auth/register" \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoke_ci","password":"smoke1234","role":"normal_user","company":"Smoke Co"}' \
            | tee /tmp/register.json
          grep -q '"success": true' /tmp/register.json

          curl -sf -c "$COOKIE" -b "$COOKIE" "$BASE/api/history" \
            | tee /tmp/history.json
          grep -q '"success"' /tmp/history.json

          # 优先使用仓库示例 CSV；若不存在则用临时样例
          if [ -f "示例财务数据.csv" ]; then
            SAMPLE="示例财务数据.csv"
          else
            SAMPLE=/tmp/sample.csv
            printf '%s\n' '日期,凭证号,科目,部门,摘要,金额,备注' > "$SAMPLE"
            for i in $(seq 1 20); do
              printf '2024-01-%02d,V%03d,办公费,财务部,测试%d,%d.00,\n' "$i" "$i" "$i" "$((1000 + i * 10))" >> "$SAMPLE"
            done
          fi

          curl -sf -c "$COOKIE" -b "$COOKIE" -X POST -F "files=@${SAMPLE}" \
            "$BASE/api/upload" | tee /tmp/upload.json
          grep -q '"success": true' /tmp/upload.json

          curl -sf -c "$COOKIE" -b "$COOKIE" "$BASE/api/dashboard" \
            | tee /tmp/dashboard.json
          grep -q '"success": true' /tmp/dashboard.json

          echo "API smoke passed"

      - name: Stop Flask
        if: always()
        run: |
          if [ -f /tmp/flask.pid ]; then kill "$(cat /tmp/flask.pid)" || true; fi
          cat /tmp/flask.log || true
