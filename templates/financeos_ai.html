<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI · FinanceOS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/financeos-ai.css') }}?v={{ ui_build }}">
</head>
<body>
  <div class="ai-shell">
    <header class="ai-head">
      <div class="ai-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60cdff"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
        <circle cx="16" cy="16" r="15" fill="url(#g)"/>
        <text x="16" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1220" font-family="Segoe UI,sans-serif">AI</text>
        </svg>
      </div>
      <div>
        <strong>FinanceOS AI</strong>
        <small>Ask me to open apps or help with finance work</small>
      </div>
    </header>
    <div id="aiMsgs" class="ai-msgs"></div>
    <div id="aiSuggest" class="ai-suggest"></div>
    <form id="aiForm" class="ai-form">
      <button type="button" id="aiMic" title="Voice">🎙</button>
      <input id="aiInput" type="text" placeholder="e.g. open vouchers / 打开审计 / help me reconcile" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='js/financeos-ai.js') }}?v={{ ui_build }}"></script>
</body>
</html>
