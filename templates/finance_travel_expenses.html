{% extends "base.html" %}
{% block title %}出差费用报销审计{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <div>
    <h4 class="mb-0"><i class="bi bi-airplane"></i> 出差费用报销审计</h4>
    <div class="text-muted small">录入差旅报销单，自动检查票据、超标、重复报销与日期合规</div>
  </div>
  <div class="btn-group btn-group-sm">
    <button class="btn btn-outline-primary active" type="button" onclick="filterClaim('')">全部</button>
    <button class="btn btn-outline-primary" type="button" onclick="filterClaim('draft')">草稿</button>
    <button class="btn btn-outline-primary" type="button" onclick="filterClaim('submitted')">已提交</button>
    <button class="btn btn-outline-primary" type="button" onclick="filterClaim('approved')">已审批</button>
    <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#claimModal">新建报销单</button>
  </div>
</div>

<div class="row g-3 mb-3" id="auditSummary">
  <div class="col-6 col-md-3"><div class="panel mb-0"><div class="panel-body py-3 text-center"><div class="small text-muted">报销单</div><div class="fs-4" id="statTotal">0</div></div></div></div>
  <div class="col-6 col-md-3"><div class="panel mb-0"><div class="panel-body py-3 text-center"><div class="small text-muted">审计通过</div><div class="fs-4 text-success" id="statPass">0</div></div></div></div>
  <div class="col-6 col-md-3"><div class="panel mb-0"><div class="panel-body py-3 text-center"><div class="small text-muted">预警</div><div class="fs-4 text-warning" id="statWarn">0</div></div></div></div>
  <div class="col-6 col-md-3"><div class="panel mb-0"><div class="panel-body py-3 text-center"><div class="small text-muted">不通过</div><div class="fs-4 text-danger" id="statFail">0</div></div></div></div>
</div>

<div class="card border-0 shadow-sm"><div class="card-body p-0">
<table class="table table-hover mb-0 align-middle">
<thead>
<tr>
  <th>单号</th><th>出差人</th><th>目的地</th><th>期间</th>
  <th class="text-end">金额</th><th>单据状态</th><th>审计</th><th>操作</th>
</tr>
</thead>
<tbody id="claimBody"><tr><td colspan="8" class="text-center py-4">加载中…</td></tr></tbody>
</table>
</div></div>

<div class="modal fade" id="claimModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">新建出差报销单</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row g-2">
          <div class="col-md-4"><label class="form-label">出差人 *</label><input class="form-control" id="cTraveler"></div>
          <div class="col-md-4"><label class="form-label">部门</label><input class="form-control" id="cDept"></div>
          <div class="col-md-4"><label class="form-label">目的地</label><input class="form-control" id="cDest"></div>
          <div class="col-md-4"><label class="form-label">开始日期</label><input type="date" class="form-control" id="cStart"></div>
          <div class="col-md-4"><label class="form-label">结束日期</label><input type="date" class="form-control" id="cEnd"></div>
          <div class="col-md-4"><label class="form-label">出差事由</label><input class="form-control" id="cPurpose"></div>
          <div class="col-12"><label class="form-label">摘要</label><input class="form-control" id="cSummary"></div>
        </div>
        <hr>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <strong>费用明细</strong>
          <button type="button" class="btn btn-sm btn-outline-primary" onclick="addLine()">加一行</button>
        </div>
        <div id="lineRows"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" type="button" onclick="saveClaim()">保存并审计</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">报销单详情</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let claimFilter = '';
let categories = { transport:'交通费', hotel:'住宿费', meal:'餐费', misc:'其他' };
const statusLabel = { draft:'草稿', submitted:'已提交', approved:'已审批', rejected:'已驳回', paid:'已付款' };
const auditLabel = { pending:'待审', pass:'通过', warn:'预警', fail:'不通过' };
const auditBadge = { pending:'secondary', pass:'success', warn:'warning', fail:'danger' };

document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('cStart').value = today;
  document.getElementById('cEnd').value = today;
  addLine();
  loadClaims();
});

function filterClaim(s) { claimFilter = s; loadClaims(); }

function addLine() {
  const wrap = document.getElementById('lineRows');
  const idx = wrap.children.length;
  const div = document.createElement('div');
  div.className = 'row g-2 mb-2 line-row';
  div.innerHTML = `
    <div class="col-md-3"><input type="date" class="form-control form-control-sm ln-date" value="${document.getElementById('cStart').value}"></div>
    <div class="col-md-2"><select class="form-select form-select-sm ln-cat">${Object.entries(categories).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
    <div class="col-md-3"><input class="form-control form-control-sm ln-desc" placeholder="说明"></div>
    <div class="col-md-2"><input type="number" step="0.01" class="form-control form-control-sm ln-amt" placeholder="金额"></div>
    <div class="col-md-2 d-flex align-items-center gap-2">
      <div class="form-check m-0"><input class="form-check-input ln-receipt" type="checkbox" checked id="rc_${idx}"><label class="form-check-label small" for="rc_${idx}">有票</label></div>
      <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.line-row').remove()">×</button>
    </div>`;
  wrap.appendChild(div);
}

function collectLines() {
  return [...document.querySelectorAll('.line-row')].map(row => ({
    expense_date: row.querySelector('.ln-date').value,
    category: row.querySelector('.ln-cat').value,
    description: row.querySelector('.ln-desc').value,
    amount: parseFloat(row.querySelector('.ln-amt').value || '0'),
    has_receipt: row.querySelector('.ln-receipt').checked,
  })).filter(x => x.amount > 0);
}

function loadClaims() {
  const url = claimFilter ? `/api/finance/travel-expenses?status=${claimFilter}` : '/api/finance/travel-expenses';
  fetch(url).then(r => r.json()).then(d => {
    if (d.categories) categories = d.categories;
    const claims = d.claims || [];
    document.getElementById('statTotal').textContent = claims.length;
    document.getElementById('statPass').textContent = claims.filter(c => c.audit_status === 'pass').length;
    document.getElementById('statWarn').textContent = claims.filter(c => c.audit_status === 'warn').length;
    document.getElementById('statFail').textContent = claims.filter(c => c.audit_status === 'fail').length;
    const body = document.getElementById('claimBody');
    body.innerHTML = claims.map(c => {
      const flags = Array.isArray(c.audit_flags) ? c.audit_flags : [];
      return `<tr>
        <td><a href="javascript:void(0)" onclick="showDetail(${c.id})">${c.claim_no}</a></td>
        <td>${escapeHtml(c.traveler)}</td>
        <td>${escapeHtml(c.destination || '-')}</td>
        <td class="small">${c.start_date} ~ ${c.end_date}</td>
        <td class="text-end">${typeof formatCurrency==='function'?formatCurrency(c.amount):Number(c.amount).toFixed(2)}</td>
        <td><span class="badge bg-secondary">${statusLabel[c.status]||c.status}</span></td>
        <td>
          <span class="badge bg-${auditBadge[c.audit_status]||'secondary'}">${auditLabel[c.audit_status]||c.audit_status}</span>
          ${c.audit_score!=null?`<span class="small text-muted ms-1">${Number(c.audit_score).toFixed(0)}</span>`:''}
          ${flags.length?`<div class="small text-danger mt-1">${flags.length} 项问题</div>`:''}
        </td>
        <td class="text-nowrap">
          <button class="btn btn-sm btn-outline-primary" onclick="runAudit(${c.id})">重审</button>
          ${c.status==='draft'?`<button class="btn btn-sm btn-outline-success" onclick="setStatus(${c.id},'submitted')">提交</button>`:''}
          ${c.status==='submitted'?`<button class="btn btn-sm btn-success" onclick="setStatus(${c.id},'approved')">通过</button>
            <button class="btn btn-sm btn-outline-danger" onclick="setStatus(${c.id},'rejected')">驳回</button>`:''}
          ${c.status==='approved'?`<button class="btn btn-sm btn-outline-success" onclick="setStatus(${c.id},'paid')">付款</button>`:''}
        </td>
      </tr>`;
    }).join('') || '<tr><td colspan="8" class="text-center text-muted py-4">暂无报销单</td></tr>';
  });
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function saveClaim() {
  const lines = collectLines();
  const payload = {
    traveler: document.getElementById('cTraveler').value.trim(),
    department: document.getElementById('cDept').value.trim(),
    destination: document.getElementById('cDest').value.trim(),
    trip_purpose: document.getElementById('cPurpose').value.trim(),
    start_date: document.getElementById('cStart').value,
    end_date: document.getElementById('cEnd').value,
    summary: document.getElementById('cSummary').value.trim(),
    lines,
  };
  fetch('/api/finance/travel-expenses', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
  }).then(r => r.json()).then(d => {
    if (!d.success) { alert(d.error || '保存失败'); return; }
    bootstrap.Modal.getInstance(document.getElementById('claimModal')).hide();
    if (typeof showToast === 'function') showToast('报销单已创建并完成初审', 'success');
    loadClaims();
    if (d.claim) showDetail(d.claim.id);
  });
}

function runAudit(id) {
  fetch(`/api/finance/travel-expenses/${id}/audit`, { method:'POST' })
    .then(r => r.json()).then(d => {
      if (!d.success) { alert(d.error || '审计失败'); return; }
      if (typeof showToast === 'function') showToast(`审计完成：${auditLabel[d.audit_status]||d.audit_status}`, 'success');
      loadClaims();
    });
}

function setStatus(id, status) {
  const note = status === 'rejected' ? (prompt('驳回原因（可选）') || '') : '';
  fetch(`/api/finance/travel-expenses/${id}/status`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ status, auditor_note: note })
  }).then(r => r.json()).then(d => {
    if (!d.success) { alert(d.error || '更新失败'); return; }
    loadClaims();
  });
}

function showDetail(id) {
  fetch(`/api/finance/travel-expenses/${id}`).then(r => r.json()).then(d => {
    if (!d.success) { alert(d.error || '加载失败'); return; }
    const c = d.claim;
    const flags = c.audit_flags || [];
    document.getElementById('detailBody').innerHTML = `
      <div class="mb-2"><strong>${c.claim_no}</strong> · ${escapeHtml(c.traveler)} · ${escapeHtml(c.destination||'')}
        <span class="badge bg-${auditBadge[c.audit_status]||'secondary'} ms-2">${auditLabel[c.audit_status]||c.audit_status}</span>
      </div>
      <div class="small text-muted mb-3">${c.start_date} ~ ${c.end_date} · ${escapeHtml(c.trip_purpose||'')} · 金额 ${Number(c.amount).toFixed(2)}</div>
      <h6>费用明细</h6>
      <table class="table table-sm"><thead><tr><th>日期</th><th>类别</th><th>说明</th><th class="text-end">金额</th><th>票据</th></tr></thead>
      <tbody>${(c.lines||[]).map(l=>`<tr>
        <td>${l.expense_date||''}</td><td>${categories[l.category]||l.category}</td>
        <td>${escapeHtml(l.description||'')}</td>
        <td class="text-end">${Number(l.amount).toFixed(2)}</td>
        <td>${l.has_receipt?'有':'无'}</td></tr>`).join('')}</tbody></table>
      <h6>审计结果 ${c.audit_score!=null?`（得分 ${Number(c.audit_score).toFixed(0)}）`:''}</h6>
      ${flags.length?`<ul class="mb-0">${flags.map(f=>`<li class="text-${f.level==='high'?'danger':'warning'}">${escapeHtml(f.message)}</li>`).join('')}</ul>`:'<div class="text-success">未发现异常</div>'}
      ${c.auditor_note?`<div class="mt-2 small">备注：${escapeHtml(c.auditor_note)}</div>`:''}
    `;
    new bootstrap.Modal(document.getElementById('detailModal')).show();
  });
}
</script>
{% endblock %}
