<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · FinanceOS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/financeos-login.css') }}?v={{ ui_build|default('13') }}">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head>
<body class="fos-login-body">
  <div class="fos-login-shell">
    <aside class="fos-login-hero">
      <div class="fos-login-brand">
        <span class="fos-mark">F</span>
        <div>
          <strong>FinanceOS</strong>
          <small>财务操作系统 · Linux 桌面体验</small>
        </div>
      </div>
      <h1>像操作系统一样用财务</h1>
      <p>凭证、应收、应付、发票、审计、消息各自独立成应用。登录后进入可视化桌面。</p>
      <ul class="fos-points">
        <li><i class="bi bi-grid-3x3-gap"></i> 桌面图标 + 开始菜单</li>
        <li><i class="bi bi-window"></i> 一应用一窗口，不臃肿</li>
        <li><i class="bi bi-shield-check"></i> 按职位显示可用软件</li>
      </ul>
      <button type="button" class="fos-demo-btn" id="demoEnterBtn">
        <i class="bi bi-play-fill"></i> 演示入口 · 进入桌面
      </button>
      <p class="fos-demo-hint">演示账号免注册，请勿录入真实业务数据</p>
    </aside>

    <main class="fos-login-panel">
      <div class="fos-tabs">
        <button type="button" class="is-active" data-tab="login">登录</button>
        <button type="button" data-tab="register">注册</button>
      </div>

      <div id="authError" class="fos-alert" style="display:none"></div>
      <div id="authSuccess" class="fos-alert ok" style="display:none"></div>

      <form id="loginForm" class="fos-form" autocomplete="on">
        <label>用户名<input id="loginUser" name="username" required minlength="2" placeholder="输入用户名"></label>
        <label>密码<input id="loginPass" name="password" type="password" required minlength="4" placeholder="输入密码"></label>
        <label class="fos-check"><input type="checkbox" id="rememberMe" checked> 记住登录（30天）</label>
        <button type="submit" class="fos-primary" id="loginBtn">进入 FinanceOS</button>
      </form>

      <form id="registerForm" class="fos-form" style="display:none" autocomplete="off">
        <label>用户名<input id="regUser" required minlength="2" placeholder="至少 2 个字符"></label>
        <label>密码<input id="regPass" type="password" required minlength="4" placeholder="至少 4 位"></label>
        <label>角色
          <select id="regRole">
            {% for key, label in roles.items() %}
            <option value="{{ key }}" {% if key == 'normal_user' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </label>
        <label id="companyLabel">公司<span id="companyReq" class="fos-req" hidden>（必填）</span>
          <input id="regCompany" placeholder="职业角色须填写，如：星河科技">
        </label>
        <p class="fos-hint" id="roleHint"></p>
        <button type="submit" class="fos-primary" id="regBtn">注册并进入桌面</button>
      </form>

      <p class="fos-foot">
        <a href="/home">经典界面</a>
        ·
        <a href="/about">关于</a>
      </p>
    </main>
  </div>

<script>
const nextUrl = {{ next_url|tojson }};
const ROLE_HINTS = {{ role_hints|tojson }};
const PROFESSIONAL = {{ professional_roles|tojson }};

function hideMsg() {
  document.getElementById('authError').style.display = 'none';
  document.getElementById('authSuccess').style.display = 'none';
}
function showError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg || '操作失败';
  el.style.display = 'block';
  document.getElementById('authSuccess').style.display = 'none';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function showOk(msg) {
  const el = document.getElementById('authSuccess');
  el.textContent = msg || '成功';
  el.style.display = 'block';
  document.getElementById('authError').style.display = 'none';
}

function syncCompanyRequirement() {
  const role = document.getElementById('regRole').value;
  const need = PROFESSIONAL.includes(role);
  const req = document.getElementById('companyReq');
  const input = document.getElementById('regCompany');
  req.hidden = !need;
  input.required = need;
  input.placeholder = need ? '必填：请填写公司名称' : '可选';
  document.getElementById('roleHint').textContent = ROLE_HINTS[role] || '';
}

document.querySelectorAll('.fos-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fos-tabs button').forEach(b => b.classList.remove('is-active'));
    btn.classList.add('is-active');
    const tab = btn.dataset.tab;
    document.getElementById('loginForm').style.display = tab === 'login' ? 'grid' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'grid' : 'none';
    hideMsg();
  });
});

document.getElementById('regRole').addEventListener('change', syncCompanyRequirement);
syncCompanyRequirement();

document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  fetch('/api/auth/login', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('loginUser').value.trim(),
      password: document.getElementById('loginPass').value,
      remember: document.getElementById('rememberMe').checked,
      next: nextUrl || '/os',
    }),
  }).then(r => r.json()).then(data => {
    if (data.success) location.href = data.redirect || nextUrl || '/os';
    else { showError(data.error || '登录失败'); btn.disabled = false; }
  }).catch(err => { showError('网络错误: ' + err.message); btn.disabled = false; });
});

document.getElementById('registerForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const btn = document.getElementById('regBtn');
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  const role = document.getElementById('regRole').value;
  const company = document.getElementById('regCompany').value.trim();

  if (username.length < 2) { showError('用户名至少 2 个字符'); return; }
  if (password.length < 4) { showError('密码至少 4 位'); return; }
  if (PROFESSIONAL.includes(role) && !company) {
    showError('该职业角色必须填写公司名称');
    document.getElementById('regCompany').focus();
    return;
  }

  btn.disabled = true;
  btn.textContent = '注册中…';
  fetch('/api/auth/register', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password, role, company, next: '/os', remember: true }),
  }).then(async r => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    return data;
  }).then(data => {
    if (data.success) {
      showOk('注册成功，正在进入桌面…');
      location.href = data.redirect || '/os';
    } else {
      showError(data.error || '注册失败');
      btn.disabled = false;
      btn.textContent = '注册并进入桌面';
    }
  }).catch(err => {
    showError('注册失败: ' + err.message);
    btn.disabled = false;
    btn.textContent = '注册并进入桌面';
  });
});

document.getElementById('demoEnterBtn').addEventListener('click', () => {
  const btn = document.getElementById('demoEnterBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split"></i> 正在进入桌面…';
  fetch('/api/auth/demo', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: '{}',
  }).then(r => r.json()).then(data => {
    if (data.success) location.href = data.redirect || '/os';
    else {
      showError(data.error || '演示入口失败');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-play-fill"></i> 演示入口 · 进入桌面';
    }
  }).catch(err => {
    showError(err.message);
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-play-fill"></i> 演示入口 · 进入桌面';
  });
});
</script>
</body>
</html>
